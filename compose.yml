name: dualroute

services:
  dualroute:
    image: ghcr.io/mkdevtests/dualroute:latest
    container_name: dualroute
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    environment:
      DUALROUTE_PORT: "9080"
      DUALROUTE_DATA_DIR: /var/lib/dualroute
      DUALROUTE_DOCKER_SOCKET: /var/run/docker.sock
      TZ: Europe/Paris
    volumes:
      - dualroute-data:/var/lib/dualroute
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  dualroute-data:
